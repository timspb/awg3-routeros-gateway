name: github-publish-arm64

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REF: ghcr.io/timspb/awg3-routeros-gateway
  IMAGE_TAG: c1-9ef68168-arm64
  IMAGE_ALIAS: main-arm64
  GATEWAY_SOURCE_COMMIT: 9ef68168a19a1ef7f88c34cd4c64e8f20a5f0e04

jobs:
  publish-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify arm64 smoke build
        run: |
          set -euo pipefail
          docker buildx bake --allow=fs.read=. -f build/bake.hcl \
            --set "*.context=." \
            --set "base.args.GATEWAY_SOURCE_COMMIT=${GATEWAY_SOURCE_COMMIT}" \
            smoke-arm64 --progress=plain

      - name: Publish immutable arm64 image
        run: |
          set -euo pipefail
          docker buildx bake --allow=fs.read=. -f build/bake.hcl \
            --set "*.context=." \
            --set "base.args.GATEWAY_SOURCE_COMMIT=${GATEWAY_SOURCE_COMMIT}" \
            --set "image-arm64.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --set "image-arm64.labels.org.opencontainers.image.revision=${GATEWAY_SOURCE_COMMIT}" \
            --set "image-arm64.output=type=image,name=${IMAGE_REF}:${IMAGE_TAG},push=true" \
            image-arm64 --progress=plain

      - name: Add convenience tag
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE_REF}:${IMAGE_ALIAS}" \
            "${IMAGE_REF}:${IMAGE_TAG}"

      - name: Verify anonymous pull
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker pull --platform linux/arm64 "${IMAGE_REF}:${IMAGE_TAG}"

      - name: Inspect published image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_REF}:${IMAGE_TAG}"
